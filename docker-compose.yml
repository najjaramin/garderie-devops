
services:
  backend:
    build:
      context: ./backend
    container_name: garderie-backend
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://192.168.30.167:4000"
    container_name: garderie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
